<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Mars Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        .bg-mars { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

<div x-data="adminApp()" x-init="init()" class="min-h-screen bg-mars">

    <!-- Top Navbar -->
    <div class="bg-gray-900/80 border-b border-gray-700/50 px-6 py-4 flex items-center justify-between sticky top-0 z-30 backdrop-blur-sm">
        <div class="flex items-center gap-3">
            <a href="/chat" class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50 transition" title="Back to Chat">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            </a>
            <div>
                <h1 class="text-white font-bold text-lg flex items-center gap-2">
                    <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    Admin Dashboard
                </h1>
                <p class="text-gray-400 text-xs">Manage users & settings</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 px-3 py-1.5 bg-gray-800/50 rounded-lg border border-gray-700/50">
                <div class="w-2 h-2 rounded-full bg-green-500"></div>
                <span class="text-gray-300 text-xs" x-text="users.filter(u => u.is_online).length + ' online'"></span>
            </div>
            <div class="flex items-center gap-2 px-3 py-1.5 bg-gray-800/50 rounded-lg border border-gray-700/50">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <span class="text-gray-300 text-xs" x-text="users.length + ' users'"></span>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="max-w-7xl mx-auto px-6 py-6">
        <!-- Search & Filter Bar -->
        <div class="flex items-center gap-3 mb-6">
            <div class="flex-1 relative">
                <svg class="w-4 h-4 text-gray-500 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input x-model="searchQuery" type="text" placeholder="Search users..."
                       class="w-full pl-10 pr-4 py-2.5 bg-gray-800/50 border border-gray-700/50 rounded-xl text-sm text-white placeholder-gray-500 focus:ring-2 focus:ring-yellow-400 focus:border-transparent">
            </div>
            <button @click="loadUsers()" class="p-2.5 bg-gray-800/50 border border-gray-700/50 rounded-xl text-gray-400 hover:text-white hover:bg-gray-700/50 transition" title="Refresh">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
        </div>

        <!-- Toast Notification -->
        <div x-show="toast.show" x-cloak x-transition
             class="fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl border text-sm"
             :class="toast.type === 'success' ? 'bg-green-900/90 border-green-700/50 text-green-300' : 'bg-red-900/90 border-red-700/50 text-red-300'">
            <span x-text="toast.message"></span>
        </div>

        <!-- Users Table -->
        <div class="bg-gray-900/60 border border-gray-700/50 rounded-2xl overflow-hidden">
            <!-- Table Header -->
            <div class="grid grid-cols-12 gap-4 px-6 py-3 bg-gray-800/40 border-b border-gray-700/50 text-xs font-medium text-gray-400 uppercase tracking-wider">
                <div class="col-span-1">ID</div>
                <div class="col-span-3">User</div>
                <div class="col-span-2">Username</div>
                <div class="col-span-2">Role</div>
                <div class="col-span-2">Status</div>
                <div class="col-span-2 text-right">Actions</div>
            </div>

            <!-- Table Rows -->
            <template x-for="u in filteredUsers" :key="u.id">
                <div class="grid grid-cols-12 gap-4 px-6 py-4 border-b border-gray-700/30 hover:bg-gray-800/30 transition items-center">
                    <!-- ID -->
                    <div class="col-span-1">
                        <span class="text-gray-400 text-sm font-mono" x-text="'#' + u.id"></span>
                    </div>
                    <!-- User (avatar + name) -->
                    <div class="col-span-3 flex items-center gap-3">
                        <div class="relative flex-shrink-0">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm overflow-hidden"
                                 :style="`background-color: ${u.avatar_color}`">
                                <img x-show="u.avatar_url" :src="u.avatar_url" class="w-full h-full object-cover">
                                <span x-show="!u.avatar_url" x-text="(u.display_name || '?')[0]"></span>
                            </div>
                            <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-gray-900"
                                 :class="u.is_online ? 'bg-green-500' : 'bg-gray-600'"></div>
                        </div>
                        <div class="min-w-0">
                            <p class="text-white text-sm font-medium truncate" x-text="u.display_name"></p>
                            <p class="text-gray-500 text-xs truncate" x-text="u.bio || 'No bio'"></p>
                        </div>
                    </div>
                    <!-- Username -->
                    <div class="col-span-2">
                        <span class="text-gray-300 text-sm" x-text="'@' + u.username"></span>
                    </div>
                    <!-- Role -->
                    <div class="col-span-2">
                        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium"
                              :class="u.is_admin ? 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30' : 'bg-gray-700/50 text-gray-400 border border-gray-600/30'">
                            <svg x-show="u.is_admin" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                            <span x-text="u.is_admin ? 'Admin' : 'User'"></span>
                        </span>
                    </div>
                    <!-- Status -->
                    <div class="col-span-2">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full" :class="u.is_online ? 'bg-green-500' : 'bg-gray-600'"></div>
                            <span class="text-xs" :class="u.is_online ? 'text-green-400' : 'text-gray-500'" x-text="u.is_online ? 'Online' : 'Offline'"></span>
                        </div>
                        <p class="text-[10px] text-gray-600 mt-0.5" x-text="u.last_seen ? formatTime(u.last_seen) : ''"></p>
                    </div>
                    <!-- Actions -->
                    <div class="col-span-2 flex items-center justify-end gap-1">
                        <button @click="openEditModal(u)"
                                class="p-2 rounded-lg text-blue-400 hover:text-blue-300 hover:bg-blue-500/10 transition" title="Edit User">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                        <button @click="openResetPwdModal(u)"
                                class="p-2 rounded-lg text-amber-400 hover:text-amber-300 hover:bg-amber-500/10 transition" title="Reset Password">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                        </button>
                        <button @click="openDeleteModal(u)"
                                x-show="u.id !== {{ user.id }}"
                                class="p-2 rounded-lg text-red-400 hover:text-red-300 hover:bg-red-500/10 transition" title="Delete User">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Empty State -->
            <div x-show="filteredUsers.length === 0" class="text-center py-16">
                <svg class="w-12 h-12 text-gray-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <p class="text-gray-500 text-sm">No users found</p>
            </div>
        </div>
    </div>

    <!-- ═══ EDIT USER MODAL ═══ -->
    <div x-show="showEditModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" @click.self="showEditModal = false">
        <div class="bg-gray-900 border border-gray-700/50 rounded-2xl p-6 w-full max-w-md mx-4 shadow-2xl">
            <h3 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                Edit User
            </h3>
            <div class="space-y-4">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold overflow-hidden"
                         :style="`background-color: ${editingUser?.avatar_color}`">
                        <img x-show="editingUser?.avatar_url" :src="editingUser?.avatar_url" class="w-full h-full object-cover">
                        <span x-show="!editingUser?.avatar_url" x-text="(editingUser?.display_name || '?')[0]"></span>
                    </div>
                    <div>
                        <p class="text-white text-sm font-medium" x-text="'@' + editingUser?.username"></p>
                        <p class="text-gray-500 text-xs" x-text="'ID: ' + editingUser?.id"></p>
                    </div>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">Display Name</label>
                    <input x-model="editForm.display_name" type="text"
                           class="w-full px-4 py-2.5 bg-gray-800/50 border border-gray-600/50 rounded-xl text-sm text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-400 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">Bio</label>
                    <textarea x-model="editForm.bio" rows="3"
                              class="w-full px-4 py-2.5 bg-gray-800/50 border border-gray-600/50 rounded-xl text-sm text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-400 focus:border-transparent resize-none"></textarea>
                </div>
                <div>
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" x-model="editForm.is_admin"
                               class="w-4 h-4 rounded border-gray-600 bg-gray-800 text-yellow-400 focus:ring-yellow-400">
                        <span class="text-sm text-gray-300">Admin privileges</span>
                    </label>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button @click="showEditModal = false"
                        class="flex-1 py-2.5 bg-gray-700 hover:bg-gray-600 text-white rounded-xl transition text-sm">Cancel</button>
                <button @click="saveUser()"
                        class="flex-1 py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-xl transition text-sm font-medium">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- ═══ RESET PASSWORD MODAL ═══ -->
    <div x-show="showResetPwdModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" @click.self="showResetPwdModal = false">
        <div class="bg-gray-900 border border-gray-700/50 rounded-2xl p-6 w-full max-w-md mx-4 shadow-2xl">
            <h3 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                Reset Password
            </h3>
            <div class="bg-gray-800/50 rounded-xl p-3 mb-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm overflow-hidden"
                     :style="`background-color: ${resetPwdUser?.avatar_color}`">
                    <span x-text="(resetPwdUser?.display_name || '?')[0]"></span>
                </div>
                <div>
                    <p class="text-white text-sm font-medium" x-text="resetPwdUser?.display_name"></p>
                    <p class="text-gray-500 text-xs" x-text="'@' + resetPwdUser?.username"></p>
                </div>
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-300">New Password</label>
                <input x-model="newPassword" type="password" placeholder="Minimum 4 characters"
                       class="w-full px-4 py-2.5 bg-gray-800/50 border border-gray-600/50 rounded-xl text-sm text-white placeholder-gray-500 focus:ring-2 focus:ring-amber-400 focus:border-transparent">
            </div>
            <div class="flex gap-3 mt-6">
                <button @click="showResetPwdModal = false"
                        class="flex-1 py-2.5 bg-gray-700 hover:bg-gray-600 text-white rounded-xl transition text-sm">Cancel</button>
                <button @click="resetPassword()"
                        class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl transition text-sm font-medium">Reset Password</button>
            </div>
        </div>
    </div>

    <!-- ═══ DELETE CONFIRM MODAL ═══ -->
    <div x-show="showDeleteModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" @click.self="showDeleteModal = false">
        <div class="bg-gray-900 border border-gray-700/50 rounded-2xl p-6 w-full max-w-sm mx-4 shadow-2xl">
            <div class="text-center">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-red-500/20 flex items-center justify-center">
                    <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </div>
                <h3 class="text-lg font-semibold text-white mb-2">Delete User?</h3>
                <p class="text-sm text-gray-400 mb-2">You are about to permanently delete:</p>
                <div class="bg-gray-800/50 rounded-xl p-3 mb-4 flex items-center gap-3 justify-center">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm overflow-hidden"
                         :style="`background-color: ${deleteUser?.avatar_color}`">
                        <span x-text="(deleteUser?.display_name || '?')[0]"></span>
                    </div>
                    <div class="text-left">
                        <p class="text-white text-sm font-medium" x-text="deleteUser?.display_name"></p>
                        <p class="text-gray-500 text-xs" x-text="'@' + deleteUser?.username"></p>
                    </div>
                </div>
                <p class="text-sm text-red-400">This action cannot be undone. All messages and data will be lost.</p>
            </div>
            <div class="flex gap-3 mt-6">
                <button @click="showDeleteModal = false"
                        class="flex-1 py-2.5 bg-gray-700 hover:bg-gray-600 text-white rounded-xl transition text-sm">Cancel</button>
                <button @click="deleteUser()"
                        class="flex-1 py-2.5 bg-red-500 hover:bg-red-600 text-white rounded-xl transition text-sm font-medium">Delete User</button>
            </div>
        </div>
    </div>

</div>

<script>
function adminApp() {
    return {
        users: [],
        searchQuery: '',
        showEditModal: false,
        showResetPwdModal: false,
        showDeleteModal: false,
        editingUser: null,
        resetPwdUser: null,
        deleteUser: null,
        editForm: { display_name: '', bio: '', is_admin: false },
        newPassword: '',
        toast: { show: false, message: '', type: 'success' },

        init() {
            this.loadUsers();
        },

        async loadUsers() {
            const res = await fetch('/api/admin/users');
            if (res.ok) {
                this.users = await res.json();
            }
        },

        get filteredUsers() {
            if (!this.searchQuery) return this.users;
            const q = this.searchQuery.toLowerCase();
            return this.users.filter(u =>
                (u.display_name || '').toLowerCase().includes(q) ||
                (u.username || '').toLowerCase().includes(q) ||
                (u.bio || '').toLowerCase().includes(q)
            );
        },

        openEditModal(u) {
            this.editingUser = u;
            this.editForm = {
                display_name: u.display_name,
                bio: u.bio || '',
                is_admin: !!u.is_admin
            };
            this.showEditModal = true;
        },

        async saveUser() {
            if (!this.editingUser) return;
            const res = await fetch(`/api/admin/users/${this.editingUser.id}/update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.editForm)
            });
            const data = await res.json();
            if (res.ok) {
                this.showToast('User updated successfully', 'success');
                this.showEditModal = false;
                await this.loadUsers();
            } else {
                this.showToast(data.error || 'Failed to update user', 'error');
            }
        },

        openResetPwdModal(u) {
            this.resetPwdUser = u;
            this.newPassword = '';
            this.showResetPwdModal = true;
        },

        async resetPassword() {
            if (!this.resetPwdUser || !this.newPassword) return;
            const res = await fetch(`/api/admin/users/${this.resetPwdUser.id}/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_password: this.newPassword })
            });
            const data = await res.json();
            if (res.ok) {
                this.showToast(`Password reset for ${this.resetPwdUser.display_name}`, 'success');
                this.showResetPwdModal = false;
            } else {
                this.showToast(data.error || 'Failed to reset password', 'error');
            }
        },

        openDeleteModal(u) {
            this.deleteUser = u;
            this.showDeleteModal = true;
        },

        async deleteUser() {
            if (!this.deleteUser) return;
            const res = await fetch(`/api/admin/users/${this.deleteUser.id}`, { method: 'DELETE' });
            const data = await res.json();
            if (res.ok) {
                this.showToast(`User ${this.deleteUser.display_name} deleted`, 'success');
                this.showDeleteModal = false;
                await this.loadUsers();
            } else {
                this.showToast(data.error || 'Failed to delete user', 'error');
            }
        },

        showToast(message, type = 'success') {
            this.toast = { show: true, message, type };
            setTimeout(() => { this.toast.show = false; }, 3000);
        },

        formatTime(val) {
            if (!val) return '';
            const d = new Date(val);
            const now = new Date();
            if (d.toDateString() === now.toDateString()) {
                return d.toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'});
            }
            return d.toLocaleDateString('id-ID', {day: '2-digit', month: '2-digit', year: 'numeric'}) + ' ' +
                   d.toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'});
        }
    };
}
</script>
</body>
</html>
